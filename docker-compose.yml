services:
  medusa-i2i:
    container_name: medusa-i2i
    build: .
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 64G
    ports:
      - "8888:8888"
    volumes:
      - ./data:/workspace
    environment:
      - WORKSPACE=/workspace
      - S3_BUCKET=medusa-bucket
      - S3_ENDPOINT_URL=https://s3.sbg.io.cloud.ovh.net
      - S3_REGION=sbg
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
